<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b2a">
<meta name="description" content="Aplicación móvil AVIPACHITO para gestión de ventas, cobros, clientes y egresos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>AVIPACHITO App</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#0c2b20,#1c563d);font-family:Arial,sans-serif;color:#fff;padding:22px}
main{width:min(420px,100%);text-align:center;background:#ffffff12;border:1px solid #ffffff30;border-radius:26px;padding:30px 22px;box-shadow:0 20px 55px #0003}
.logo{width:100px;height:100px;margin:0 auto 16px}h1{margin:0;font-size:27px;letter-spacing:1px}.subtitle{color:#e5e7eb;line-height:1.5;margin:12px 0 24px}
a.btn{display:block;background:#d8b54a;color:#183222;text-decoration:none;font-weight:700;border-radius:14px;padding:16px;margin:12px 0;font-size:16px}
.note{font-size:12px;color:#d1d5db;margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<main>
<img class="logo" src="icon.svg" alt="AVIPACHITO">
<h1>AVIPACHITO</h1>
<p class="subtitle">Sistema móvil de ventas, clientes, cobros y egresos.</p>
<a class="btn" href="https://script.google.com/macros/s/AKfycbw-H_9s8GM55P0NWRK-Bc0r974506DhQHPw6Ou14F9HACTipBJk15GvAKhvuuF9waqQ/exec" rel="noopener">Ingresar al sistema</a>
<p class="note">Para instalar: abre esta página en Chrome Android y elige ⋮ → “Instalar aplicación” o “Añadir a pantalla principal”. Requiere conexión a Internet.</p>
</main>
</body>
</html>
